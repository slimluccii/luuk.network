name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          DATOCMS_TOKEN: ${{ secrets.DATOCMS_TOKEN }}

      - name: Deploy router to production script
        run: node scripts/deploy-router.mjs
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_SCRIPT_ID: ${{ secrets.BUNNY_SCRIPT_ID }}

      - name: Deploy router to preview script
        run: node scripts/deploy-router.mjs
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_SCRIPT_ID: ${{ secrets.PREVIEW_SCRIPT_ID }}

      - name: Deploy and route production
        run: |
          node scripts/deploy-deployment.mjs \
            --route luuk.network \
            --route luuk-network.b-cdn.net
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_STORAGE_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
